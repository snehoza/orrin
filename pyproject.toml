[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinator-kit"
version = "1.0.0"
description = "Run several coding agents on one machine: detached jobs with completion markers, a fair machine lock, short waits, a lane board, status, tidy and protected data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "snehoza" }]
keywords = ["agents", "ai-agents", "coding-agents", "job-queue", "lock", "worktree", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/snehoza/coordinator-kit"
Issues = "https://github.com/snehoza/coordinator-kit/issues"
Changelog = "https://github.com/snehoza/coordinator-kit/blob/main/CHANGELOG.md"

[project.scripts]
coordinator = "coordinator_kit.cli:main"

[tool.setuptools.packages.find]
include = ["coordinator_kit*"]

[tool.setuptools.package-data]
coordinator_kit = ["templates/*.md", "templates/*.json", "templates/briefs/*.md"]
